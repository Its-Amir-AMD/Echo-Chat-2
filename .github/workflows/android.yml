name: Android CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build EchoChat APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify no Firebase runtime/build dependencies
        run: |
          if grep -RInE 'com\.google\.firebase|libs\.firebase|com\.google\.gms\.google-services|google-services\.json' \
            echochat-fixed-source/app/src/main \
            echochat-fixed-source/app/build.gradle.kts \
            echochat-fixed-source/build.gradle.kts \
            echochat-fixed-source/gradle/libs.versions.toml; then
            echo "Unexpected Firebase dependency detected."
            exit 1
          fi

      - name: Configure optional release signing
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ENCODED_KEYSTORE" && -z "$STORE_PASSWORD" && -z "$KEY_PASSWORD" ]]; then
            echo "No release signing secrets configured; release APK will be unsigned."
            exit 0
          fi
          if [[ -z "$ENCODED_KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure ENCODED_KEYSTORE, STORE_PASSWORD and KEY_PASSWORD together." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/echochat-upload-key.jks"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run tests, lint, and build debug plus release APKs
        working-directory: echochat-fixed-source
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoChat-APK-builds
          path: |
            echochat-fixed-source/app/build/outputs/apk/debug/app-debug.apk
            echochat-fixed-source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
