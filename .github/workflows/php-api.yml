name: PHP API checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    name: PHP syntax and API contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Lint backend PHP files
        run: |
          php -l server/config.example.php
          php -l server/public/index.php
      - name: Verify PHP-only backend contract
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS auth_attempts" server/database/schema.sql
          grep -q "function enforce_auth_rate_limit" server/public/index.php
          grep -q "POST.*auth/register" server/README.md
          grep -q "POST.*auth/login" server/README.md
